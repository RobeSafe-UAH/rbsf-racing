# Path-tracking tuning for eps_oval_single_wall on the simulators, loaded on top of
# <law>_sim.yaml for both steering laws (launch_common.py). MVSim, 2026-10-21, 5+ laps per run:
# - The hairpin around the end of the inner wall is an S-bend (centerline radius 0.53 m, under
#   the car's 0.74 m turning radius). The default lookahead (0.5 + 0.2 v) laps at 3.25 m/s but
#   saturates the steering there at 3.5 m/s and spins. 0.9 + 0.2 v (1.55 m at 3.25 m/s) cuts it
#   smoothly: 5.0 s laps at 3.25 m/s (default config at 3.0 m/s: 5.9 s), and 3/3 clean runs at
#   3.5 m/s. 3.75 m/s crashes in the first corner (the start overshoots to 4.3 m/s).
# - Not the global default: on levine it grazes the walls at 2-3 m/s.
/**:
  ros__parameters:
    speed: 3.25
    lookahead_min: 0.9
    lookahead_gain: 0.2
