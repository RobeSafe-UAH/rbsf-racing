# MAP (Model- and Acceleration-based Pursuit) parameters for the real car (not tested on the car yet).
# The wildcard applies them in every car namespace (/r0/map_controller, ...).
# See rbsf_path_tracking/path_tracker_node.py.
/**:
  ros__parameters:
    steering_law: map
    # Constant speed (m/s). drive_gate clips it to its max_auto_speed (2.0 on the car).
    speed: 1.0
    # Lookahead distance L = min(lookahead_min + lookahead_gain * speed, lookahead_max) (m, s).
    lookahead_min: 0.5
    lookahead_gain: 0.2
    lookahead_max: 3.0
    # Steering added per unit of lateral acceleration (rad per m/s^2): delta = atan(wheelbase k)
    # + understeer_gradient * v^2 k. 0 is Pure Pursuit. Identify it on the car (steady-state
    # circles: steering angle against lateral acceleration) before raising it.
    understeer_gradient: 0.0
    # Vehicle: wheelbase (m, same as the other real-car controllers; measure it) and steering
    # limit (rad).
    wheelbase: 0.33
    max_steering: 0.4189
    # Control loop rate (Hz) and the odometry age (s) after which the car is not driven
    # (drive_gate then stops it).
    rate: 50.0
    odom_timeout: 0.5
    start_at: 0.0
