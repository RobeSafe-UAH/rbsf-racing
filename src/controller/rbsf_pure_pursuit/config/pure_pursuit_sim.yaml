# Pure Pursuit parameters for the f1tenth_gym simulation. The wildcard applies them to every
# namespaced instance (/r0/pure_pursuit, /opponents/or0/pure_pursuit, ...).
/**:
  ros__parameters:
    # Waypoint CSV (gym centerline or raceline format), set per launch.
    waypoints_file: ''
    # Constant speed (m/s). Used when the file has no speed profile (centerlines).
    speed: 2.0
    # Multiplies the raceline's speed profile, when the file has one.
    speed_scale: 0.6
    # Lookahead distance L = lookahead_min + lookahead_gain * speed (m, s). Shorter cuts corners
    # less: 0.8 + 0.25 v clipped Levine's tightest corner in MVSim.
    lookahead_min: 0.5
    lookahead_gain: 0.2
    lookahead_max: 3.0
    # Vehicle (F1TENTH): wheelbase lf + lr and steering limit.
    wheelbase: 0.3302
    max_steering: 0.4189
    # Control loop rate (Hz).
    rate: 50.0
    # Wall-clock start time (s since the epoch), set by the demos so all cars start together.
    start_at: 0.0
