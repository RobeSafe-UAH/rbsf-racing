# Wall-following parameters for the simulators (MVSim, f1tenth_gym). The wildcard applies them to
# every namespaced instance (/r0/wall_follower, ...).
/**:
  ros__parameters:
    # Constant forward speed (m/s). drive_gate clips it to its max_auto_speed.
    speed: 1.5
    # Distance PI: steering (rad) per metre of distance error, and its integral term.
    distance_kp: 1.0
    distance_ki: 0.0
    distance_integral_limit: 1.0
    # Orientation PI: steering (rad) per radian of wall angle, and its integral term.
    orientation_kp: 1.0
    orientation_ki: 0.0
    orientation_integral_limit: 1.0
    # Boundaries (walls or cone rows) come from the scan points inside strips, never from single
    # rays (see wall_following.py). Each side: the nearest boundary within bin_length (m) along
    # x beside the car, and lookahead (m) ahead for its orientation. Keep bin_length longer than
    # the gaps between cones (the RoboRacer cone rows use up to ~0.4 m).
    bin_length: 1.0
    lookahead: 1.2
    # The car's path for the free distance ahead: |y| <= path_half_width (m), car half-width plus
    # a margin. Keep it above half the widest cone gap, or a row ahead can hide in the gap.
    path_half_width: 0.3
    # Points less than front_margin (m) before the obstacle ahead are the obstacle, not a side.
    front_margin: 0.2
    # Hits needed in a strip before it counts (rejects stray returns).
    min_points: 3
    # Steering limit (rad).
    max_steering: 0.4189
    # Gaps: a wall whose lateral hit is farther than this (m) is lost (doorway, side opening,
    # the inner wall of a corner). With both lost the car holds its heading. Keep it above half
    # the widest section: below that, the car never sees both walls and never centres (the sim
    # tracks are 1.6-3.5 m wide).
    max_wall_distance: 2.0
    # With one wall lost, hold half the corridor width last measured with both walls, while that
    # width is younger than width_memory (s); else hold fallback_distance (m) to the visible wall.
    width_memory: 2.0
    fallback_distance: 0.4
    # Corners: below corner_distance (m) of free space in the car's path, steering blends
    # linearly into full lock at corner_min_distance, towards the side that is more open just
    # before the obstacle.
    corner_distance: 1.5
    corner_min_distance: 0.7
    # Which boundary to follow: 'centre' (both), or 'left' / 'right', the inner boundary of a lap
    # driven counter-clockwise / clockwise. Centring drives into bays that open off the loop
    # (eps_oval_single_wall); the inner boundary always leads around it. One side holds
    # min(side_distance, half the corridor width) to it, and turns towards it when it ends.
    follow_side: left
    side_distance: 0.6
