# Particle filter on the simulators. MVSim's odom is ground truth, so the motion noise only has to
# cover the steps between scans; the filter is tested for consistency and recovery here.
particle_filter:
  ros__parameters:
    max_particles: 2000
    max_viz_particles: 60
    # Hokuyo UST-10LX in MVSim: 1081 beams over 270 deg at 40 Hz -> 61 beams.
    angle_step: 18
    max_range: 10.0
    range_method: cddt
    theta_discretization: 112
    rangelib_variant: 2
    squash_factor: 2.2
    # Beam model (sigma_hit in map pixels: 8 px = 0.4 m at 0.05 m/px).
    z_hit: 0.75
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    sigma_hit: 8.0
    motion_dispersion_x: 0.02
    motion_dispersion_y: 0.01
    motion_dispersion_theta: 0.05
    initial_pose_std: [0.5, 0.5, 0.4]
    transform_tolerance: 0.1
